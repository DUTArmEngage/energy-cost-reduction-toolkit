; ECRT Uno firmware.
;   pio run                 build for the Uno           pio run -t upload       flash it
;   pio test -e native      run the protocol tests on this computer (needs a C++ compiler)
; Pin numbers are in include/pins.h, timing and limits in include/config.h.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
  mandulaj/PZEM-004T-v30@^1.1.2
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  chris--a/Keypad@^3.1.1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++11
