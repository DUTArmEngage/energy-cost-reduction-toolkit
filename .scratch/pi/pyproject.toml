[project]
name = "ecrt-pi-scratch"
version = "0.1.1"
description = "Scratch experiments for the ECRT Raspberry Pi side."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "streamlit>=1.67.0",
]

[project.scripts]
ecrt-pi-scratch = "ecrt_pi_scratch:main"
ecrt-ui = "ecrt_pi_scratch.cli:run_ui"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
