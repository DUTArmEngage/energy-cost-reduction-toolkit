; Scratch project for the Arduino Uno: one environment per component test, so there is a single project.
; Build and upload one test:    pio run -e test_relay -t upload
; Watch its output:             pio device monitor -e test_relay
; Build everything:             pio run
; Pin numbers come from firmware/arduino/include/pins.h, so the tests and the firmware share one pin map.

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -I${PROJECT_DIR}/../../firmware/arduino/include

[env:hello]
build_src_filter = -<*> +<main.cpp>

; Blinks the onboard LED (D13) and prints to the USB serial: needs no wiring. D13 is also keypad row R4.
[env:test_blinky]
build_src_filter = -<*> +<test_blinky.cpp>

; USB serial link to the Pi (D0/D1): heartbeat and echo. Works with the Pi or any serial terminal.
[env:test_serial_link]
build_src_filter = -<*> +<test_serial_link.cpp>

; I2C bus scan on A4/A5: finds the LCD backpack address.
[env:test_i2c_scan]
build_src_filter = -<*> +<test_i2c_scan.cpp>

; LCD 1602 I2C backpack on A4/A5.
[env:test_lcd]
build_src_filter = -<*> +<test_lcd.cpp>
lib_deps = marcoschwartz/LiquidCrystal_I2C@^1.1.4

; 4x4 keypad on D10-D13 (rows) and A0-A3 (columns).
[env:test_keypad]
build_src_filter = -<*> +<test_keypad.cpp>
lib_deps = chris--a/Keypad@^3.1.1

; 4-channel relay module on D4-D7 (active-low). Keep mains disconnected: listen for the clicks and watch the module LEDs.
[env:test_relay]
build_src_filter = -<*> +<test_relay.cpp>

; PZEM-004T V4 TTL serial on D2/D3 (SoftwareSerial). The PZEM mains side needs a supply, so this is a bench test with a qualified
; person present; the TTL side alone will report read errors.
[env:test_pzem]
build_src_filter = -<*> +<test_pzem.cpp>
lib_deps = mandulaj/PZEM-004T-v30@^1.1.2
